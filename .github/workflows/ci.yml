name: CI

on:
  # Every pull request, whatever it targets. Filtering to [develop, main] left
  # stacked PRs — one feature branch based on another — with no checks at all,
  # which is how a commit that did not build reached PR #1377. A stacked PR is
  # exactly the case that needs verifying: its base is unreviewed code.
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Cancel in-progress runs for the same ref so a force-push doesn't queue
# obsolete jobs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (supply-chain hardening); the trailing
# comment is the human-readable tag. The .NET SDK is pinned via global.json.
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  backend:
    name: backend — build + unit tests + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET (version pinned via global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        # -p:Configuration=Release so the NuGet audit runs under the same
        # config as the build. TreatWarningsAsErrors is Release-only, so a
        # default (Debug) restore leaves NU1902/NU1903 as warnings and a
        # vulnerable package can never fail this job (#1125).
        run: dotnet restore SmartSentinelEye.slnx -p:Configuration=Release

      - name: Build (Release)
        run: dotnet build SmartSentinelEye.slnx -c Release --no-restore

      # The fixture's pure decision logic needs no Docker, but it lives in
      # Integration.Tests, which coverage-check.ps1 excludes by project name —
      # so this job compiled these tests and never ran them, and their only
      # execution was the 30-minute `integration` job. Runs here, against the
      # assembly the Release build above already produced. The exclusion in
      # coverage-check.ps1 stays: it exists to keep Docker-bound tests out of
      # the coverage run, not to hide these classes.
      #
      # Selected by trait, not by class name. The name filter this replaced read
      # `~AspireFixtureReportSelectionTests`, and the very next Docker-free class
      # — AspireFixtureMigrationGateTests — did not match it, recreating the
      # omission this step exists to remove (#2064). A trait is the one selector
      # a new class cannot silently fall outside of.
      - name: Docker-free fixture logic tests
        run: |
          # #2409: same hang-watchdog reasoning as coverage-check.ps1's
          # $testArgs comment — a silent hang here reads as `cancelled`, not
          # `failure`, and is just as invisible.
          #
          # #2289: a --filter matching zero tests exits 0 today (measured:
          # `--filter "Category=NoSuchCategoryAtAll"` prints "No test matches
          # the given testcase filter" and still exits 0), so a typo'd or
          # renamed category here would report success having run nothing.
          # `-- RunConfiguration.TreatNoTestsAsError=true` is a VSTest
          # run-setting, effective only after a standalone `--`, that turns
          # that zero-match case into a non-zero exit instead.
          dotnet test tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj \
            -c Release \
            --no-build \
            --filter "Category=FixtureLogic" \
            --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 3min \
            -- RunConfiguration.TreatNoTestsAsError=true

      # Single test pass: coverage-check runs the unit + architecture tests once
      # (with coverage + a .trx), reusing the build above via -NoBuild, and
      # enforces the ADR-0065 gate. Previously the suite ran twice — a plain
      # test step plus coverage-check rebuilding and re-running it.
      - name: Unit + architecture tests + coverage gate (ADR-0065)
        shell: pwsh
        run: pwsh scripts/coverage-check.ps1 -Configuration Release -NoBuild

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: artifacts/coverage/report
          retention-days: 14

      # #2409: --blame-hang writes a mini-dump (plus a sequence trace) into
      # the hung host's results directory when it fires. Nothing uploaded
      # that before, so a real hang's only evidence died with the runner.
      #
      # Not scoped to `**/TestResults/` — verified against a real hang
      # (deliberately induced, see the PR body) that coverage-check.ps1's
      # loop writes into `artifacts/coverage/raw/<project>/<guid>/`, because
      # that loop passes its own `--results-directory`; only the ci.yml
      # fixture-logic step (no override) lands under the vstest default
      # `TestResults/`.
      #
      # The sequence-file glob is deliberately loose (`*Sequence*`, not
      # anchored to a prefix or suffix): the collector assembly we ran
      # against writes `Sequence_<guid>.xml` (prefix), confirmed the same
      # way as the directory above, but `dotnet test --help` in this same
      # pinned SDK documents the opposite — `<guid>_Sequence.xml` (suffix).
      # The two disagree, and the help text is exactly what a future reader
      # checks first, so anchoring to either spelling risks a "fix" into a
      # glob that matches nothing. Matching both costs nothing here.
      # `if-no-files-found: ignore` matters: on every normal run this glob
      # matches nothing, and that must not fail the job.
      - name: Upload hang/crash diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-blame-diagnostics
          path: |
            **/*.dmp
            **/*Sequence*.xml
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: frontend — lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The repo has declared a Prettier convention since it had a frontend —
      # .prettierrc.json, .prettierignore, and eslint-config-prettier in all
      # three packages so ESLint defers formatting to it. Nothing ran it, so 47
      # files had drifted out of it unnoticed (#1910). Enforced here rather than
      # left to the next person to rediscover.
      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # `pnpm test` runs the workspace's `test` script, which caps
      # `--workspace-concurrency` at 1 (root package.json). `apps/kiosk-web` and
      # `apps/management-web` otherwise run their Vitest suites concurrently on
      # this one runner, each sizing its own fork pool from the runner's core
      # count — oversubscribing it by construction. That contention was the
      # actual cause of #2520/#2419's flake, not an under-sized timeout alone
      # (spec 216 §R2 materialised). This is a resource decision, not a
      # performance one — do not revert it to shave wall-clock time.
      - name: Test
        run: pnpm test

  integration:
    name: integration tests (Docker)
    runs-on: ubuntu-latest
    needs: [backend]
    timeout-minutes: 30
    # Integration tests are gated on the cheaper backend job passing
    # first; no point burning the 30-minute container-startup budget on
    # a branch that already fails unit tests.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET (version pinned via global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify Docker is available
        run: docker info

      - name: Restore
        run: dotnet restore tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj -p:Configuration=Release

      - name: Build integration tests (Release)
        run: dotnet build tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj -c Release --no-restore

      - name: Run integration tests
        # #2410: blame-hang watchdog, sized against this job's own measured
        # timing (specs/167-a-slow-hang-that-fails-loudly/spec.md §2-3), not
        # copied from `backend`'s (#2409) 3-minute figure — that population
        # is fakes-only with near-zero inter-test gaps; this one boots a
        # real Aspire/Docker stack inside a collection fixture, and four
        # independent green runs show a stable, structurally-explained
        # 120-134s host-wide inactivity ceiling (AspireFixture's own
        # ~132s bring-up, invisible to any single test's duration since
        # xUnit dispatches no gated test until the fixture's
        # InitializeAsync returns; separately, EventIngestion.
        # PoisonDeliveryEscapeIntegrationTests legitimately runs ~97s on a
        # retry/backoff path). 12min is chosen to clear that ceiling by
        # >5x AND to sit above AspireFixture's own internal
        # `StartupTimeout` (8min, AspireFixture.cs) with margin -- below
        # StartupTimeout, --blame-hang would pre-empt that mechanism's own
        # richer, resource-named TimeoutException with a generic hang dump
        # that (during fixture boot) has no dispatched test to attribute
        # the hang to.
        #
        # The margin, stated as a figure rather than "with margin": 12min -
        # 8min = 240s. That 240s has to absorb the one failure class
        # --blame-hang exists to backstop above StartupTimeout (spec.md
        # §2.6) -- StartupTimeout's own `cts` firing but the cancellation not
        # propagating instantly through some awaited call
        # (WaitForResourceAsync/Docker/Aspire). Measured directly rather
        # than assumed (spec.md §5 counterfactual 2's procedure --
        # StartupTimeout shrunk to 10s, temporarily, locally, reverted), and
        # two different regions of the boot gave two very different
        # answers:
        #
        # - WaitForResourceAsync awaiting ResourceNotificationService (one
        #   WaitForResourceAsync pointed at a resource name that can never
        #   resolve): the fixture's own TimeoutException fired ~30ms after
        #   the nominal 10s -- essentially instant.
        # - DCP/container bring-up inside StartAsync: a first attempt at a
        #   nominally-correct ordering (--blame-hang-timeout 20s over a 10s
        #   StartupTimeout) still lost -- StartAsync's
        #   OperationCanceledException did not surface until ~74s wall
        #   against the 10s cutoff, a ~64s propagation delay, and
        #   --blame-hang fired first anyway despite the "correct" ordering.
        #
        # So nominal ordering (CI value > StartupTimeout) is not sufficient
        # by itself -- what matters is absolute margin large enough to
        # survive the slower of the two measured delays. 240s is ~3-4x the
        # ~64s worst case actually measured, not a hedge against a purely
        # hypothetical one. Third-party code that ignores the token
        # entirely (the class spec 166 §2.1 found in
        # `WhepValidatorUnreachableRealmTests`) remains unbounded and
        # unmeasurable -- that risk is still real, but it is the second
        # reason for a floor, not the first.
        #
        # This budget is coupled to three things that can drift it without
        # anyone touching this file: (1) AspireFixture gaining another
        # gated resource (grows the ~132s boot figure), (2) EventIngestion's
        # retry/backoff policy changing PoisonDeliveryEscapeIntegrationTests's
        # ~97s, and (3) StartupTimeout itself (AspireFixture.cs, currently
        # 8min) -- the only one of the three that *inverts* the 12min/8min
        # ordering rather than merely consuming margin. A later slice
        # raising StartupTimeout toward or above 12min would, from that
        # commit on, cause every boot-phase hang to be pre-empted by
        # --blame-hang's generic dump with no dispatched test to attribute
        # it to, instead of StartupTimeout's own resource-state/exit-code/
        # log-tail table (spec.md §2.6) -- and nothing on the AspireFixture
        # side flags this coupling today (tracked: #2412). Checked, not
        # assumed: StartupTimeout's own 8min figure has never moved in this
        # file's history. The fixture's boot-wait logic has been retuned
        # before as ordinary feature work (#2064, the migration-exit-code
        # gate) -- not a precedent for the timeout itself having drifted,
        # but evidence this class of change happens here without anyone
        # thinking to check ci.yml. Re-measure (don't just copy this number
        # forward) if any of the three moves.
        #
        # Three categories are excluded. The first two are spec 020, and share a
        # reason: they measure or disturb the runner rather than the code.
        #
        # Measurement — a thirty-second saturating burst on a shared runner
        # measures the runner, and that number would later be quoted as if it
        # measured this code.
        #
        # Disruptive — restarting a resource through Aspire fails outright on
        # the runner ("Failed to stop resource"), and a test that goes red on a
        # platform limitation rather than a defect teaches people to ignore red
        # CI. The cost is real: SC-002 has no CI coverage and is verified by
        # hand instead (specs/020-durable-ingest-ack/verification.md).
        #
        # Maintenance — a sweep that operates on a long-lived run-mode stack it
        # did not start (#2004). It refuses without one, so in CI it would be a
        # guaranteed red that says nothing about the code.
        run: |
          # #2289: same `-- RunConfiguration.TreatNoTestsAsError=true` as the
          # "Docker-free fixture logic tests" step's comment above — but this
          # filter *excludes* three named categories rather than including
          # one, so it can only select zero if the whole suite is empty; its
          # more realistic failure (an exclusion that stops excluding)
          # already surfaces as a red job, loudly, without this flag.
          dotnet test tests/Integration.Tests/SmartSentinelEye.Integration.Tests.csproj \
            -c Release \
            --no-build \
            --filter "Category!=Measurement&Category!=Disruptive&Category!=Maintenance" \
            --logger "trx;LogFileName=integration.trx" \
            --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 12min \
            -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-test-results
          # #2410: --blame-hang writes a mini-dump (and a sequence trace)
          # into this same dotnet test call's results directory. Unlike
          # coverage-check.ps1's per-project --results-directory override
          # (which backend's equivalent step has to work around with a
          # repo-root-relative **/*.dmp glob), this call site takes no
          # --results-directory override, so everything lands under the
          # vstest default TestResults/ -- but verified directly against a
          # real hang dump (counterfactual 1, PR body), the .trx lands flat
          # in TestResults/ while the .dmp and Sequence*.xml do not: vstest
          # writes them one level deeper, under a per-run GUID subfolder
          # (TestResults/<guid>/...), and a second copy lands three levels
          # deep (TestResults/<host>_<timestamp>/In/<host>/...). A
          # single-segment `**/TestResults/*.dmp` (matching only a direct
          # child of TestResults/) misses both -- the plan's original
          # anchor assumed the .trx's flat placement generalised to the
          # blame outputs, and it does not. `**/TestResults/**/*.dmp` (a
          # second `**` between TestResults/ and the filename) is what
          # actually matches, confirmed against both nesting depths above.
          #
          # *Sequence*, not a prefix/suffix anchor: this pinned SDK's
          # collector writes `Sequence_<guid>.xml` but `dotnet test --help`
          # documents the opposite, `<guid>_Sequence.xml` -- the two
          # disagree (verified against the collector assembly directly),
          # so the loose glob matches either rather than risking a future
          # "fix" into one that matches neither.
          path: |
            **/TestResults/*.trx
            **/TestResults/**/*.dmp
            **/TestResults/**/*Sequence*.xml
          retention-days: 14

      # #2410: the outermost of three layers. --blame-hang (above) and
      # AspireFixture's own StartupTimeout (AspireFixture.cs) both depend on
      # something inside the test host noticing the hang and unwinding
      # cleanly enough to throw or dump. If neither does, the job runs to
      # its 30-minute timeout-minutes wall and everything with it is lost --
      # the same gap 709d56c8 (#2137) closed for e2e's apphost.log. That
      # job's AppHost is a separate `dotnet run` process with a redirected
      # log file; this job's AppHost runs in-process via
      # DistributedApplicationTestingBuilder, so there is no equivalent
      # single log file -- but the Docker containers it starts are still
      # visible to the runner's own Docker daemon regardless of what the
      # test host is doing.
      #
      # Not always(): 709d56c8's own reasoning, reused verbatim -- this
      # would print a large amount of output on every green run for no
      # reason. failure() || cancelled(), matching that precedent exactly.
      #
      # On a genuine failure() (not cancelled()), expect an EMPTY container
      # list, and that is not this step being broken. This job launches the
      # AppHost with E2ETests=true (AspireFixture.InitializeAsync's own
      # `parameters` array), which -- via AppHost.cs's `isRunMode &&
      # !isE2ETests` gate on every `WithLifetime(ContainerLifetime.Persistent)`
      # -- makes every container here ephemeral, not persistent. On an
      # ordinary red test, the host process exits normally,
      # AspireFixture.DisposeAsync runs (AspireFixture.cs), and DCP tears the
      # containers down before this step ever runs -- `docker ps -a` prints
      # nothing to see, legitimately. This step's payload only has something
      # to capture on the cancelled() branch, where the runner kills the job
      # out from under the test host before teardown can run.
      #
      # Residual, unverifiable without inducing a real 30-minute
      # timeout-minutes cancellation, recorded rather than fixed: if the test
      # host *does* reach AspireFixture.DisposeAsync inside the runner's
      # cancellation grace window, that teardown deliberately runs with
      # CancellationToken.None (AspireFixture.cs, "No token by design" --
      # teardown must release the stack even while the run is being torn
      # down) and would then race this step's `docker ps -a` / `docker logs`
      # against DCP's own `docker rm` -- a partial capture is possible in
      # that narrow window. Known limitation, not addressed here.
      - name: Container state and logs (on failure or cancellation)
        if: failure() || cancelled()
        run: |
          timeout 60 docker ps -a || true
          for c in $(docker ps -aq); do
            echo "::group::$(docker inspect -f '{{.Name}}' "$c" | sed 's#^/##')"
            timeout 30 docker logs --tail 200 "$c" || true
            echo "::endgroup::"
          done

  e2e:
    name: e2e (Playwright, full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Boots the full Aspire stack in RUN mode (web apps + gateway + Keycloak)
    # and drives the browser through it (ADR-0108). Gated on the cheap jobs so a
    # branch that already fails lint/units doesn't burn the boot budget.
    #
    # Raised from 40 to 45 (#2376). The `always()`/`cancelled()`-guarded
    # diagnostic steps below already ran and the Playwright report already
    # uploaded on the run that prompted this (34859447889, artifact
    # 10356401686, 9 files) -- a job-level timeout does grant that grace
    # period, so this raise does not fix a skipped step. What it buys: a run
    # whose tail hangs (e.g. a slow-but-passing retry) gets enough headroom to
    # finish and let Playwright's reporters write a complete report, instead
    # of being cancelled a couple of minutes short with the suite otherwise
    # green. #2376 stays open -- closing it needs Playwright's own
    # `globalTimeout` so a hang ends the run from inside the process that
    # holds the report writers, which is #2382's job once that issue's known
    # 15.5-minute teardown hang is fixed (sizing globalTimeout against a
    # distribution that still contains it would repeat this issue's mistake).
    timeout-minutes: 45
    env:
      ASPIRE_ALLOW_UNSECURED_TRANSPORT: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up .NET (version pinned via global.json)
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.3

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', 'global.json', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify Docker is available
        run: docker info

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Ensure the ASP.NET dev cert exists (Keycloak HTTPS)
        run: dotnet dev-certs https

      - name: Build the stack (Release)
        run: |
          dotnet restore SmartSentinelEye.slnx -p:Configuration=Release
          dotnet build SmartSentinelEye.slnx -c Release --no-restore

      - name: Boot the Aspire stack (run mode) in the background
        run: |
          rm -f "$GITHUB_WORKSPACE/stack-status.tsv"
          nohup dotnet run --project src/AppHost/SmartSentinelEye.AppHost.csproj -c Release --no-build -- ScenarioSimulator=false StackStatusFile="$GITHUB_WORKSPACE/stack-status.tsv" > apphost.log 2>&1 &
          echo "$!" > apphost.pid
          echo "AppHost PID $(cat apphost.pid)"

      - name: Wait for the stack to be ready
        run: bash scripts/wait-for-e2e-stack.sh

      - name: Run the Playwright e2e suite
        run: pnpm test:e2e

      # Runs on a red suite too (#2077): a retried pass reports identically to
      # a clean one today, and that's the gap this step closes. `if: always()`
      # so a failed or cancelled run still gets the section — FR-006 makes a
      # missing report say so rather than silently reporting zero retries.
      - name: Summarise retried e2e outcomes
        if: always()
        run: node scripts/summarise-e2e-retries.mjs

      # `failure()` is false when the job is cancelled, and a job-level
      # `timeout-minutes` expiry is a cancellation. Run 33623647778's e2e job
      # hit the 40-minute timeout, so this step was skipped and apphost.log was
      # discarded — on exactly the failure it exists to explain (#2137). The
      # two `always()` siblings below ran in that same job, which is what says
      # the guard rather than the runner was the problem.
      #
      # Not `always()`: that would print 300 lines on every green run. These
      # two conditions are the cases the step is for.
      - name: AppHost log (on failure or cancellation)
        if: failure() || cancelled()
        run: |
          tail -n 300 apphost.log || true
          echo "--- stack-status.tsv ---"
          cat "$GITHUB_WORKSPACE/stack-status.tsv" 2>/dev/null || echo "(no status report was ever written)"

      - name: Stop the AppHost
        if: always()
        run: |
          if [ -f apphost.pid ]; then kill "$(cat apphost.pid)" 2>/dev/null || true; fi

      # #2287: a real Keycloak sign-in means a Playwright trace records a real
      # bearer token, a real refresh token, a client secret and the seeded
      # realm password verbatim (specs/186-a-trace-that-keeps-its-secrets/
      # spec.md §1.3). Two independent guarantees close that off, because
      # neither alone is enough:
      #   1. The script itself fails closed (deletes what it cannot scrub,
      #      plan.md §7.6) — this covers a partial failure that still exits 0.
      #   2. The upload below is gated on `steps.scrub.outcome == 'success'`,
      #      which is also false when this step is skipped or cancelled — so
      #      a scrub that never ran can never be followed by an unscrubbed
      #      upload. `outcome` is GitHub's pre-`continue-on-error` result
      #      (`conclusion` is the post-override one), so this gate holds even
      #      if `continue-on-error: true` were ever added here. Still don't
      #      add it: a failed scrub would then no longer fail the job itself,
      #      hiding a real problem from the job's own pass/fail signal even
      #      though this specific gate would stay correct.
      - name: Scrub credentials from the Playwright artifacts
        id: scrub
        if: always()
        run: node scripts/scrub-playwright-artifacts.mjs

      - name: Upload Playwright report
        if: always() && steps.scrub.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report

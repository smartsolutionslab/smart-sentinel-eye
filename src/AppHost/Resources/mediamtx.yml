# MediaMTX configuration for Smart Sentinel Eye (spec 002, T002).
#
# - Paths are added dynamically by StreamDistribution.Api against
#   MediaMTX's HTTP API on port 9997; the `paths:` block below stays empty.
# - WHEP playback is exposed on port 8889 with HTTP external
#   authentication; MediaMTX POSTs every WHEP open to a single fixed address,
#   StreamDistribution.Api's /streams/authorize, with the stream path + the
#   client bearer in the JSON body (FR-007 + AuthorizeWhepCommandHandler).
# - RTSP ingest port (8554) accepts source pulls.

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# Webrtc + RTSP listeners
webrtc: yes
webrtcAddress: :8889
# Bind a TCP ICE mux alongside the default UDP mux (:8189). In dev the host
# browser reaches the SFU through a Docker port map where UDP ICE often can't
# traverse Docker Desktop's VM NAT; the TCP mux gives a reliable media path.
# The host-reachable candidate is injected by the AppHost (run mode) via
# MTX_WEBRTCADDITIONALHOSTS. In prod the browser + SFU share an L2 (spec 002),
# so MediaMTX's local interface candidates suffice.
webrtcLocalTCPAddress: :8189
rtsp: yes
rtspAddress: :8554

# External auth hook: every WHEP open is validated by StreamDistribution.Api.
# `stream-distribution` resolves via Aspire's service-discovery DNS once both
# containers join the AppHost network. The auth endpoint validates the bearer
# token forwarded by MediaMTX and returns 200/401/403.
authMethod: http
authHTTPAddress: http://stream-distribution:8080/streams/authorize
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# Dynamic paths block — populated at runtime via the HTTP API. Static
# entries here would conflict with the API-managed entries.
paths: {}
